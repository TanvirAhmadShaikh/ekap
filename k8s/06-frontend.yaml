---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ekap
  labels:
    app: open-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      hostAliases:
        # Allows token exchange callback to resolve inside the pod
        - ip: "127.0.0.1"
          hostnames: ["localhost"]
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:main
          env:
            - name: OPENAI_API_BASE_URL
              value: http://retrieval-service:8000/v1
            - name: OPENAI_API_KEY
              value: ekap-internal
            - name: WEBUI_AUTH
              value: "true"
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: ekap-secrets, key: webui-secret-key}
            - name: ENABLE_OAUTH_SIGNUP
              value: "true"
            - name: OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef: {name: ekap-secrets, key: keycloak-client-id}
            - name: OAUTH_CLIENT_SECRET
              value: ""
            - name: OPENID_PROVIDER_URL
              value: http://keycloak:8080/auth/realms/ekap/.well-known/openid-configuration
            - name: OAUTH_PROVIDER_NAME
              value: "EKAP SSO"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
          readinessProbe:
            httpGet: {path: /, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 2Gi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ekap
spec:
  selector:
    app: open-webui
  ports:
    - port: 8080
