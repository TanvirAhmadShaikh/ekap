# TEMPLATE — replace every <base64-...> value before applying.
# Generate: echo -n 'myvalue' | base64
#
# Apply with: kubectl apply -f k8s/01-secrets.yaml
# Or use Sealed Secrets / External Secrets Operator for production.
apiVersion: v1
kind: Secret
metadata:
  name: ekap-secrets
  namespace: ekap
type: Opaque
data:
  postgres-user:              <base64-postgres-user>
  postgres-password:          <base64-postgres-password>
  postgres-db:                <base64-ekap>
  keycloak-admin:             <base64-keycloak-admin-user>
  keycloak-admin-password:    <base64-keycloak-admin-password>
  keycloak-realm:             <base64-ekap>
  keycloak-client-id:         <base64-ekap-web>
  webui-secret-key:           <base64-random-32-char-string>
  grafana-admin-password:     <base64-grafana-password>
  vllm-model:                 <base64-Qwen/Qwen2.5-7B-Instruct>
  hf-token:                   <base64-hf-token-or-empty>
