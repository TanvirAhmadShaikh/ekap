global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: retrieval-service
    static_configs:
      - targets: [retrieval-service:8000]
    metrics_path: /metrics

  - job_name: ingestion-service
    static_configs:
      - targets: [ingestion-service:8000]
    metrics_path: /metrics

  - job_name: qdrant
    static_configs:
      - targets: [qdrant:6333]
    metrics_path: /metrics

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
