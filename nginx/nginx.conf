worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 75s;
    client_max_body_size 512m;

    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/m;
    limit_req_zone $binary_remote_addr zone=upload:10m rate=10r/m;

    # Only send Connection: upgrade for actual WebSocket handshakes
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream open_webui    { server open-webui:8080;         keepalive 32; }
    upstream keycloak      { server keycloak:8080;           keepalive 16; }
    upstream retrieval_svc { server retrieval-service:8000;  keepalive 32; }
    upstream ingestion_svc { server ingestion-service:8000;  keepalive 16; }
    upstream grafana       { server grafana:3000;            keepalive  8; }

    server {
        listen 80;
        server_name _;

        # ── Static: Admin portal ──────────────────────────────────────────────
        location ^~ /admin/ {
            alias /usr/share/nginx/html/admin/;
            try_files $uri $uri/ /admin/index.html;
        }

        # ── Static: Employee portal ───────────────────────────────────────────
        location ^~ /portal/ {
            alias /usr/share/nginx/html/portal/;
            try_files $uri $uri/ /portal/index.html;
        }

        # ── Keycloak ──────────────────────────────────────────────────────────
        location /auth/ {
            proxy_pass         http://keycloak;
            # $host strips the port, which made Keycloak's redirect/console
            # URLs drop :8080 and land on a different (unserved) port.
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Host  $http_host;
            proxy_buffer_size        128k;
            proxy_buffers            4 256k;
            proxy_busy_buffers_size  256k;
        }

        # ── Document upload (strict rate limit, exact match has priority) ─────
        location = /api/documents/upload {
            limit_req zone=upload burst=5 nodelay;
            proxy_pass         http://ingestion_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # auth.py trusts X-User-Id as an unverified identity for internal
            # service-to-service calls — strip anything a public client sent so
            # it can't be used to impersonate a user past the public edge.
            proxy_set_header   X-User-Id         "";
            proxy_read_timeout 300s;
        }

        # ── DMS API: documents + folders + workflow + keycloak lookups + notifications + retention + audit-log → ingestion-service ──
        location ~ ^/api/(documents|folders|workflow|keycloak|notifications|retention|audit-log) {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://ingestion_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-User-Id         "";
            proxy_read_timeout 300s;
        }

        # ── Chat completions / OpenAI-compat → retrieval service directly ─────────
        location ~ ^/v1/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://retrieval_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-User-Id         "";
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 360s;
        }

        # ── EKAP retrieval API (explicit paths — avoids stealing Open WebUI's /api/) ──
        location ~ ^/api/(query|conversations|feedback|llm) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://retrieval_svc;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-User-Id         "";
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 120s;
        }

        # ── Grafana ───────────────────────────────────────────────────────────
        location /grafana/ {
            proxy_pass         http://grafana;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Open WebUI (catch-all) ────────────────────────────────────────────
        location / {
            proxy_pass         http://open_webui;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_buffering    off;
            proxy_read_timeout 120s;
        }
    }
}
